name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pagesの公開処理は同時に1つだけ実行します。
# 新しい公開が始まった場合は、古い実行を自動的に終了します。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install control app dependencies
        run: npm ci --prefix control-app

      - name: Check source code
        run: npm run lint

      - name: Check control app source code
        run: npm run lint --prefix control-app

      - name: Build website
        run: npm run build

      - name: Build control app
        run: npm run build --prefix control-app

      - name: Add control app to website
        run: |
          mkdir -p dist/control
          cp -R control-app/dist/. dist/control/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    needs:
      - build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

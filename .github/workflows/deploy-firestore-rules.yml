name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QR_MANAGEMENT_SYSTEM_4127D }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GitHub Secret FIREBASE_SERVICE_ACCOUNT_QR_MANAGEMENT_SYSTEM_4127D が未設定です。"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QR_MANAGEMENT_SYSTEM_4127D }}
          project_id: qr-management-system-4127d

      - name: Deploy Firestore rules
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --only firestore:rules
          --project qr-management-system-4127d
          --non-interactive

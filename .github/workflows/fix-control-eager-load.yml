name: Fix control eager load

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix control eager load') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make control pages eager-loaded
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('control-app/src/App.tsx')
          text = path.read_text()
          old = '''import {\n  lazy,\n  Suspense,\n  useCallback,'''
          new = '''import {\n  useCallback,'''
          if old not in text:
              raise SystemExit('React lazy import block not found')
          text = text.replace(old, new, 1)

          old = '''const AnalysisPage = lazy(() => import("../../src/pages/AnalysisPage"));\nconst PastDataPage = lazy(() => import("../../src/pages/PastDataPage"));'''
          new = '''import AnalysisPage from "../../src/pages/AnalysisPage";\nimport PastDataPage from "../../src/pages/PastDataPage";'''
          if old not in text:
              raise SystemExit('Lazy page declarations not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify no lazy control pages remain
        run: |
          if grep -n 'lazy(() => import' control-app/src/App.tsx; then
            echo 'Lazy control page import remains'
            exit 1
          fi

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-app/src/App.tsx
          git commit -m "Fix control eager load"
          git push

name: Fix management page CSS preload

on:
  push:
    branches:
      - main

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix management page CSS preload' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep management CSS in PWA cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vite.config.ts')
          text = path.read_text()
          names = [
              'SettingsPage',
              'DeviceManagementPage',
              'CreateEventPage',
              'EventManagementPage',
              'MembersPage',
              'TicketsPage',
              'ControlPage',
          ]
          for name in names:
              text = text.replace(f'          "**/{name}-*.{{js,css}}",\n', '')
          path.write_text(text)
          PY
          git rm .github/workflows/fix-management-css-preload.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts
          git commit -m "Fix management page CSS preload"
          git push

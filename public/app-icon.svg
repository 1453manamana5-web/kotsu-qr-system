<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">QR受付 スキャンゲート</title>
  <desc id="description">
    紫から青の背景に、QR読み取り枠を備えた白いゲート
  </desc>

  <defs>
    <linearGradient
      id="app-icon-background"
      x1="62"
      y1="42"
      x2="458"
      y2="474"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#8b5cf6" />
      <stop offset="0.48" stop-color="#6d52ef" />
      <stop offset="1" stop-color="#1478ed" />
    </linearGradient>

    <radialGradient
      id="app-icon-highlight"
      cx="0"
      cy="0"

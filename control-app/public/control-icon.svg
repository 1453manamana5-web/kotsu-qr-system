<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">QR管理・管制システム</title>
  <desc id="description">
    紫から青の背景に、丸みのある白い管制パネルと緑・黄色の状態ランプ
  </desc>

  <defs>
    <linearGradient
      id="control-icon-background"
      x1="62"
      y1="42"
      x2="458"
      y2="474"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#8b5cf6" />
      <stop offset="0.48" stop-color="#6d52ef" />
      <stop offset="1" stop-color="#1478ed" />
    </linearGradient>

    <radialGradient
      id="control-icon-highlight"
      cx="0"
      cy="0"
      r="1"
      gradientTransform="translate(155 106) rotate(48) scale(304)"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#control-icon-background)" />
  <rect width="512" height="512" fill="url(#control-icon-highlight)" />

  <rect
    x="126"
    y="132"
    width="260"
    height="248"
    rx="54"
    fill="none"
    stroke="#ffffff"
    stroke-width="30"
  />

  <circle cx="190" cy="214" r="28" fill="#5ee0a0" />
  <circle cx="322" cy="214" r="28" fill="#ffbd45" />

  <path
    d="M174 310h164M256 278v64"
    fill="none"
    stroke="#ffffff"
    stroke-width="30"
    stroke-linecap="round"
  />
</svg>

<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#7c4dff"
    />

    <meta
      name="description"
      content="交通研究部のイベント受付・入退場・部員・チケットを管理するQRコード管理システム"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="QR受付"
    />

    <link
      rel="icon"
      href="%BASE_URL%favicon.ico"
      sizes="48x48"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon-180x180.png"
    />

    <link
      rel="apple-touch-startup-image"
      href="%BASE_URL%apple-splash-ipad-portrait.png"
      media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />

    <link
      rel="apple-touch-startup-image"
      href="%BASE_URL%apple-splash-ipad-landscape.png"
      media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
    />

    <style>
      /*
        本体のCSSを読み込む前でも、
        起動アイコンが別の位置に表示されないようにします。
      */
      .app-splash-screen {
        position: fixed;
        z-index: 10000;

        inset: 0;

        display: grid;

        place-items: center;
      }

      .app-splash-brand {
        position: relative;

        display: grid;

        width: 100%;

        justify-items: center;
      }

      .app-splash-icon {
        position: relative;

        width:
          clamp(
            132px,
            22vw,
            196px
          );

        aspect-ratio: 1 / 1;

        overflow: hidden;

        border-radius: 28%;

        opacity: 0;
      }

      .app-splash-icon img {
        display: block;

        width: 100%;
        height: 100%;
      }

      .app-splash-brand h1 {
        position: absolute;

        top: 100%;
        left: 50%;

        opacity: 0;

        transform:
          translateX(-50%);
      }
    </style>

    <title>
      交通研究部QRコード管理システム
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
